plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 本机使用 brew JDK 21；通过 --release 17 保证产出 Java 17 兼容字节码
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.configs', 'mixins.e33chat.json'
            jvmArg '-Dmixin.env.remapRefMap=true'
            jvmArg "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.configs', 'mixins.e33chat.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.e33chat.refmap.json'
    config 'mixins.e33chat.json'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 国内镜像：maven central
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
    // 本地 Plasmo Voice jar（libs/）
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Plasmo Voice 联动（可选依赖）
    // 编译期使用官方 jar；运行时玩家需自行安装 Plasmo Voice 模组
    compileOnly "ccnrcom:plasmovoice-forge-1.20.1-2.1.13:2.1.13"
    // 注意：开发环境（runServer/runClient）不会加载 Plasmo Voice
    // （其 mixin 为 SRG 映射，dev 官方映射环境不兼容），联调请在真实服务端验证

    // ---- 测试（JUnit5；离线开发环境不自动跑，显式 `-PrunTests` 才执行） ----
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_group_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'   : mod_group_id,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'mixins.e33chat.json'
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    onlyIf { project.hasProperty('runTests') }
}

// 把 mixin AP 生成的 refmap 复制到 resources（compileJava 时 AP 生成到 tmp）
tasks.register('copyRefmap', Copy) {
    from "${buildDir}/tmp/compileJava"
    into "${buildDir}/resources/main"
    include 'mixins.e33chat.refmap.json'
}
compileJava.finalizedBy 'copyRefmap'
compileTestJava.dependsOn copyRefmap
jar.dependsOn copyRefmap

// dev 环境生成 MANIFEST.MF，让 MixinPlatformAgentDefault 发现 mixin 配置
tasks.register('writeDevManifest') {
    doLast {
        def mfDir = file("${buildDir}/resources/main/META-INF")
        mfDir.mkdirs()
        file("${mfDir}/MANIFEST.MF").text =
                'Manifest-Version: 1.0\n' +
                'MixinConfigs: mixins.e33chat.json\n'
        logger.lifecycle('Generated MANIFEST.MF with MixinConfigs for dev environment')
    }
}
processResources.finalizedBy writeDevManifest

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        palantirJavaFormat()
        licenseHeaderFile 'config/spotless/license-header.txt'
        trimTrailingWhitespace()
        endWithNewline()
    }
}