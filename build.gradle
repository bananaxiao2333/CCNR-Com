plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.diffplug.spotless' version '6.25.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 本机使用 brew JDK 21；通过 --release 17 保证产出 Java 17 兼容字节码
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // 国内镜像：maven central
    maven { url = uri('https://maven.aliyun.com/repository/public') }
    mavenCentral()
    // 本地 Plasmo Voice jar（libs/）
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Plasmo Voice 联动（可选依赖）
    // 编译期使用官方 jar；运行时玩家需自行安装 Plasmo Voice 模组
    compileOnly "ccnrcom:plasmovoice-forge-1.20.1-2.1.13:2.1.13"
    // 注意：开发环境（runServer/runClient）不会加载 Plasmo Voice
    // （其 mixin 为 SRG 映射，dev 官方映射环境不兼容），联调请在真实服务端验证

    // ---- 测试（JUnit5；离线开发环境不自动跑，显式 `-PrunTests` 才执行） ----
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_group_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version' : project.version,
                'Implementation-Vendor'   : mod_group_id,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    onlyIf { project.hasProperty('runTests') }
}

spotless {
    java {
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'
        palantirJavaFormat()
        licenseHeaderFile 'config/spotless/license-header.txt'
        trimTrailingWhitespace()
        endWithNewline()
    }
}